# Board package for an ESP8266 (tested target: Wemos/LOLIN D1 mini).
#
# LED data must be on GPIO3 (RX): only there does the DMA driver run undisturbed by WiFi.
# That pin is also the serial receive line, so serial logging is off (logs work over WiFi).
# Optional DS3231 on D2 (SDA) / D1 (SCL).

substitutions:
  led_pin: GPIO3
  sda_pin: GPIO4
  scl_pin: GPIO5

packages:
  core: !include core.yaml

esp8266:
  board: d1_mini
  # keep settings across power loss
  restore_from_flash: true

logger:
  baud_rate: 0

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: false

light:
  - id: !extend clock_light
    platform: neopixelbus
    type: GRB
    variant: WS2812X
    method: esp8266_dma
    pin: ${led_pin}
